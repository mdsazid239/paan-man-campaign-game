<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Win</title>
  <link rel="stylesheet" href="asset/css/style.css"  />
</head>
<body>
  <div
    class="pm-win-page"
    style="background-image: url('./asset/images/paak-man-logo.png');"
  >
    <div class="pm-win-container">
      <div class="pm-win-card">
        <img
          src="./asset/images/paan-man-chasma1.png"
          alt="pacman"
          class="pm-main-image"
        />

        <img
          src="./asset/images/win.png"
          alt="win"
          class="pm-win-logo"
        />

        <p class="pm-win-text">
          Score Above 500 To
        </p>

        <p class="pm-reward-text">
          A Reward!
        </p>

        <button class="pm-play-btn">
          PLAY!
        </button>
      </div>
    </div>
  </div>
</body>
</html>
