<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registration</title>
  <link rel="stylesheet" href="asset/css/style.css" />
</head>
<body>
  <div
    class="pm-register-page"
    style="background-image: url('asset/images/paak-man-logo.png');"
  >
    <div class="pm-register-overlay">
      <img
        src="asset/images/paak-man-logo1.png"
        alt="Paak Man"
        class="pm-logo"
      />

      <h2>Registration</h2>

      <form class="pm-form">
        <input type="text" placeholder="Full Name" />
        <input type="tel" placeholder="Mobile No." />

        <h3>Are you above 18?</h3>

        <div class="pm-age-btns">
          <button type="button">Yes</button>
          <button type="button">No</button>
        </div>

        <label class="pm-checkbox">
          <input type="checkbox" />
          <span>I accept all terms and conditions</span>
        </label>

        <button type="submit" class="pm-submit-btn">
          GET CODE
        </button>
      </form>
    </div>
  </div>
</body>
</html>
